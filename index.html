<h2>Hisaab lagao</h2>
<input id="kilo" placeholder="Kitne kilo?">
<input id="rate" placeholder="Rate kya hai?">
<button onclick="hisaab()">Total nikalo</button>
<p id="total"></p>
<script>
function hisaab() {
  var kilo = document.getElementById('kilo').value;
  var rate = document.getElementById('rate').value;
  var total = kilo * rate;
  document.getElementById('total').innerHTML = 'Total: ₹' + total;
}
</script>
